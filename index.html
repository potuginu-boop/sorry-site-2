<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Для тебя ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.25);
}

#mainBtn{
    position:absolute;
    bottom:50px;
    padding:18px 45px;
    border:none;
    border-radius:40px;
    background:#ff4fa3;
    color:white;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 0 25px #ff4fa3;
    transition:.25s;
}

#mainBtn:hover{
    transform:scale(1.07);
}

.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    justify-content:center;
    align-items:center;
}

.card{
    width:400px;
    background:white;
    border-radius:25px;
    padding:35px;
    text-align:center;
    animation:show .35s;
}

.card h1{
    color:#ff4fa3;
}

.card p{
    margin-top:15px;
    font-size:18px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:25px;
}

.btn{
    border:none;
    cursor:pointer;
    border-radius:18px;
    padding:14px 25px;
    font-size:18px;
}

.yes{
    background:#ff4fa3;
    color:white;
}

.no{
    background:#555;
    color:white;
}

#error{
    margin-top:15px;
    color:red;
    font-weight:bold;
}

@keyframes show{
from{transform:scale(.7);opacity:0;}
to{transform:scale(1);opacity:1;}
}
</style>

</head>

<body>

<img src="cats.png" id="bg">

<div class="overlay"></div>

<button id="mainBtn" onclick="openCard()">
💖 Нажми 💖
</button>

<div class="popup" id="popup">

<div class="card">

<h1>🥺 Прости...</h1>

<p>
Мне очень жаль... ❤️
</p>

<div class="buttons">

<button class="btn no" onclick="errorMsg()">
❌ Не обнимать
</button>

<button class="btn yes" onclick="flowers()">
❤️ Обнять
</button>

</div>

<div id="error"></div>

</div>

</div>

<script>

function openCard(){
document.getElementById("popup").style.display="flex";
}

function errorMsg(){
document.getElementById("error").innerHTML="❌ Произошла ошибка. Попробуйте позже.";
}

function flowers(){

document.body.innerHTML=`

`;

}

</script>

</body>
</html>
